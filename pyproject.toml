[project]
name = "ml-helper"
version = "0.1.0"
description = "A portfolio of machine learning techniques: documented knowledge, vectorized computation, and interactive notebooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "marimo>=0.25.0",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
