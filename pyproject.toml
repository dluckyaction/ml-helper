[project]
name = "ml-helper"
version = "0.1.0"
description = "Machine learning helper platform built on hexagonal architecture with a strict pure core"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/infrastructure", "src/entrypoints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
